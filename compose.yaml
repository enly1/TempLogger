services:
  templogger:
    image: enly1/templogger:latest
    platform: linux/amd64
    pull_policy: always
    restart: unless-stopped
    user: "${TEMPLATELOGGER_UID:-10001}:${TEMPLATELOGGER_GID:-987}"
    security_opt:
      - apparmor=unconfined
    network_mode: host
    environment:
      TZ: Europe/London
      ESPHOME_API_KEY: ${ESPHOME_API_KEY:-}
    command:
      - --web
      - --bind
      - 0.0.0.0
      - --db
      - /data/readings.sqlite
      - --file
      - /data/readings.csv
      - --local-ble
      - --proxies
      - esp32-bluetooth-proxy-8f3b98.local,esp32-bluetooth-proxy-8d1244.local
    volumes:
      - templogger_data:/data
      - /run/dbus/system_bus_socket:/run/dbus/system_bus_socket
volumes:
  templogger_data:
    external: true
    name: templogger_data
