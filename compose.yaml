services:
  templogger:
    image: enly1/templogger:latest
    platform: linux/amd64
    pull_policy: always
    restart: unless-stopped
    user: "${TEMPLATELOGGER_UID:-10001}:${TEMPLATELOGGER_GID:-987}"
    security_opt:
      - apparmor=unconfined
    network_mode: host
    environment:
      TZ: Europe/London
      ESPHOME_API_KEY: ${ESPHOME_API_KEY:-}
      BT_PROXY_1: ${BT_PROXY_1:-esp32-bluetooth-proxy-8f3b98.local}
      BT_PROXY_2: ${BT_PROXY_2:-esp32-bluetooth-proxy-8d1244.local}
    command:
      - --web
      - --bind
      - 0.0.0.0
      - --db
      - /data/readings.sqlite
      - --file
      - /data/readings.csv
      - --local-ble
      - --proxies
      - ${BT_PROXY_1:-esp32-bluetooth-proxy-8f3b98.local},${BT_PROXY_2:-esp32-bluetooth-proxy-8d1244.local}
    volumes:
      - templogger_data:/data
      - /run/dbus/system_bus_socket:/run/dbus/system_bus_socket
  logs-8f3b98:
    image: enly1/templogger:latest
    platform: linux/amd64
    pull_policy: always
    restart: unless-stopped
    network_mode: host
    command: ["--proxy-logs", "--proxy", "${BT_PROXY_1:-esp32-bluetooth-proxy-8f3b98.local}"]
    environment:
      TZ: Europe/London
      ESPHOME_API_KEY: ${ESPHOME_API_KEY:-}
      BT_PROXY: ${BT_PROXY_1:-esp32-bluetooth-proxy-8f3b98.local}
  logs-8d1244:
    image: enly1/templogger:latest
    platform: linux/amd64
    pull_policy: always
    restart: unless-stopped
    network_mode: host
    command: ["--proxy-logs", "--proxy", "${BT_PROXY_2:-esp32-bluetooth-proxy-8d1244.local}"]
    environment:
      TZ: Europe/London
      ESPHOME_API_KEY: ${ESPHOME_API_KEY:-}
      BT_PROXY: ${BT_PROXY_2:-esp32-bluetooth-proxy-8d1244.local}
volumes:
  templogger_data:
    external: true
    name: templogger_data
