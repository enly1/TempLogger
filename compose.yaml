services:
  templogger:
    image: enly1/templogger:latest
    platform: linux/amd64
    pull_policy: always
    restart: unless-stopped
    ports:
      - "9000:9000"
    environment:
      TZ: Europe/London
      ESPHOME_API_KEY: ${ESPHOME_API_KEY:-}
    command:
      - --web
      - --bind
      - 0.0.0.0
      - --db
      - /data/readings.sqlite
      - --file
      - /data/readings.csv
      - --local-ble
    volumes:
      - templogger_data:/data
      - /run/dbus/system_bus_socket:/run/dbus/system_bus_socket
volumes:
  templogger_data:
    name: templogger_data
