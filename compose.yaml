services:
  templogger:
    image: enly1/templogger:latest
    platform: linux/amd64
    pull_policy: always
    restart: unless-stopped
    ports:
      - "9002:9000"
    environment:
      TZ: Europe/London
      ESPHOME_API_KEY: ${ESPHOME_API_KEY:-}
    volumes:
      - templogger_data:/data
volumes:
  templogger_data:
    name: templogger_data
