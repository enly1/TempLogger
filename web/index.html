<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TempLogger · Sensor dashboard</title>
  <link rel="stylesheet" href="/style.css">
  <script defer src="/dashboard.js"></script>
</head>
<body>
  <main>
    <header>
      <div><p class="device">BLE SENSOR DASHBOARD</p><h1>Temperature log</h1></div>
      <p id="status" role="status">Loading history…</p>
    </header>
    <section id="sensor-metrics" class="sensor-metrics" aria-label="Current sensor readings"></section>
    <section class="history" aria-label="Reading history">
      <div class="toolbar">
        <nav id="ranges" aria-label="Time range">
          <button data-range="300000">5m</button><button data-range="600000">10m</button>
          <button data-range="900000">15m</button><button data-range="1200000">20m</button>
          <button data-range="1800000">30m</button><button data-range="2700000">45m</button>
          <button data-range="3600000">1h</button>
          <button data-range="21600000">6h</button><button data-range="86400000" aria-pressed="true">24h</button>
          <button data-range="604800000">7d</button><button data-range="2592000000">30d</button>
          <button data-range="0">All</button>
        </nav>
        <div class="controls">
          <div class="chart-mode" role="group" aria-label="Chart rendering">
            <button id="smooth-mode" aria-pressed="true">Smooth</button>
            <button id="raw-mode" aria-pressed="false">Raw</button>
          </div>
          <button id="mock-mode" aria-pressed="false">Mock data</button>
          <button id="earlier" aria-label="Earlier readings" title="Earlier readings">←</button>
          <button id="later" aria-label="Later readings" title="Later readings">→</button>
          <button id="zoom" aria-label="Zoom in" title="Zoom in">＋</button>
          <button id="live" aria-pressed="true">Live</button>
        </div>
      </div>
      <p class="chart-help">Left-drag to zoom · right-drag to select readings for deletion</p>
      <fieldset id="sensor-list" class="sensor-list" hidden><legend>Visible sensors</legend></fieldset>
      <figure><figcaption>Temperature <small>°C</small></figcaption><canvas id="temp-chart" role="img" aria-label="Temperature over time; drag to zoom"></canvas></figure>
      <figure><figcaption>Humidity <small>%</small></figcaption><canvas id="humidity-chart" role="img" aria-label="Humidity over time; drag to zoom"></canvas></figure>
      <figure><figcaption>Battery <small>%</small></figcaption><canvas id="battery-chart" role="img" aria-label="Battery percentage over time; drag to zoom"></canvas></figure>
      <figure><figcaption>Battery voltage <small>mV</small></figcaption><canvas id="voltage-chart" role="img" aria-label="Battery voltage over time; drag to zoom"></canvas></figure>
      <figure><figcaption>Signal strength <small>dBm</small></figcaption><canvas id="rssi-chart" role="img" aria-label="Signal strength over time; drag to zoom"></canvas></figure>
      <footer><span id="window"></span><output id="detail"></output></footer>
    </section>
  </main>
</body>
</html>
